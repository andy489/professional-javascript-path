<!DOCTYPE html>
<head>
    <title>WebAssembly.compileStreaming</title>
    <link rel="stylesheet" href="simple.css" />
</head>
<body>
    <header>
        <h1>Using Exports from a WebAssembly Instance</h1>        
    </header>
    <main>
        
    </main>
    <script>
        
function useExports() {
    const fileName = 'no-import.wasm';
    const fetchPromise = fetch(fileName);
    WebAssembly.instantiateStreaming(fetchPromise)
    .then(results => {
        const instance = results.instance;
        console.log(`functionOne returns ${instance.exports.functionOne()}`);
        console.log(`functionTwo returns ${instance.exports.functionTwo()}`);
    });
}
    </script>
</body>
</html>

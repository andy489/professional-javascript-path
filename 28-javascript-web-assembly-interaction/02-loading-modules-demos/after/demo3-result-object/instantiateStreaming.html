<!DOCTYPE html>
<head>
    <title>instantiateStreaming</title>
    <link rel="stylesheet" href="simple.css" />
</head>
<body>
    <header>
        <h1>Create a WebAssembly Instance with WebAssembly.instantiateStreaming</h1>   
    </header>
    <main>
        <aside>
            <h5>WASM Loading Info</h5>
            <div id="log"></div>
        </aside>
        <form>
            <p><strong>Enter the wasm file name</strong></p>
            <p>
                <input type="text" id="wasm_file">
            </p>
            <button id="fromStream">Create Instance From Stream</button>
            <button id="fromModule">Create Instance From Module</button>
            <button type="reset">Reset</button>
        </form>
    </main>
    <script>
        let module;
        
        function instanceFromModule() {
            if (module) {
                addToLog(`Creating instance from ${module}`);
                // const instance = new WebAssembly.Instance(module);
                WebAssembly.instantiate(module)
                .then(instance => {
                    addToLog(`Instance ${instance} created`);
                })
                
            }
        }
        function loadWASM(fileName) {
            const fetchPromise = fetch(fileName);
            addToLog(`Loading ${fileName}`);
            // Note - this only works when the wasm file has no imports
            WebAssembly.instantiateStreaming(fetchPromise)
            .then(result => {
                addToLog(`Loaded instance ${result.instance}`);
                module = result.module;
            });
        }

        const log = document.querySelector('#log');
        let logStart;
        function addToLog(message) {
            const item = document.createElement('p');
            let time;
            if(!logStart) {
                logStart = Date.now();
                time = 0;
            } else {
                const millis = Date.now() - logStart;
                time = Math.floor(millis);
            }
            const content = document.createTextNode(`${time}ms: ${message}`);
            item.appendChild(content);
            log.appendChild(item);
        }

        addEventListener('submit', (event) => {
            resetState();
            if(event.submitter.id === 'fromStream') {
                const formElement = document.querySelector('#wasm_file');
                const fileName = formElement.value;
                loadWASM(fileName); 
            } else {
                instanceFromModule();
            }
            event.preventDefault();
        });

        addEventListener('reset', (event) => {
           resetState();
        });
        
        function resetState() {
            logStart = null;
            while (log.firstChild) {
                log.removeChild(log.firstChild);
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html>

<head>
    <title>WebAssembly.Memory</title>
    <link rel="stylesheet" href="simple.css" />
</head>

<body>
    <header>
        <h1>WebAssembly Exception: RuntimeException (i.e. trap)</h1>
    </header>
    <main></main>
    <script>

        let instance;
        function instantiate() {
            WebAssembly.instantiateStreaming(fetch('divide.wasm'))
                .then(result => {
                    instance = result.instance;
                });
        }


        function divide(num, denom) {
            try {
                const result = instance.exports.divide(num, denom);

            } catch (error) {
                if (error instanceof WebAssembly.RuntimeError) {
                    console.log(`RuntimeError: ${error.message}`);
                }
            }
        }

    </script>
</body>

</html>
